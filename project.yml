name: FreeAudio
options:
  bundleIdPrefix: com.freeaudio
  deploymentTarget:
    macOS: "27.0"

targets:
  FreeAudio:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: FreeAudio
        excludes:
          - "**/*.md"
    info:
      path: FreeAudio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAudioCaptureUsageDescription: "FreeAudio, uygulamaların ses düzeyini ayarlamak için sistem sesine erişir. / FreeAudio needs system audio access to control each app's volume."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeaudio.app
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "FreeAudio - Ücretsiz ve Açık Kaynak"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: FreeAudio/FreeAudio.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
