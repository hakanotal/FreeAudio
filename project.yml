name: FreeAudio
options:
  bundleIdPrefix: com.freeaudio
  deploymentTarget:
    macOS: "14.0"

targets:
  FreeAudio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FreeAudio
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeaudio.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "FreeAudio - Ücretsiz ve Açık Kaynak"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: FreeAudio/FreeAudio.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: FreeAudio/FreeAudio-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "FreeAudio, ekranların canlı önizlemesini göstermek için ekran kaydı iznine ihtiyaç duyar."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
